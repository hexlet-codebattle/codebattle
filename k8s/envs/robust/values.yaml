# Multi-node robust cluster profile
# Node groups:
# - app nodes: label=app (codebattle only)
# - runner nodes: label=runner (zig runners only)
ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: ""
  tls: []

codebattle:
  service:
    type: NodePort
  nodeSelector: {}

zigRunners:
  strategy: robust
  avoidCodebattleNode: true
  appNodeSelector:
    label: app
  runnerNodeSelector:
    label: runner
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
