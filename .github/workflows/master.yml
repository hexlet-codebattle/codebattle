name: Build master

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'hexlet-codebattle/codebattle'
    runs-on: ubuntu-latest
    outputs:
      codebattle_image: ${{ steps.filter.outputs.codebattle_image }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect image-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            codebattle_image:
              - 'Containerfile.codebattle'
              - 'Makefile'
              - 'nginx.conf'
              - 'nginx-assets-entrypoint.sh'
              - 'mix.exs'
              - 'mix.lock'
              - 'lib/**'
              - 'priv/**'
              - 'static/**'
              - 'frontend/**'
              - 'config/**'
              - 'coveralls.json'

  backend_tests:
    if: github.repository == 'hexlet-codebattle/codebattle'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MIX_ENV: test
      POSTGRES_PASSWORD: postgres
      CODEBATTLE_DB_HOSTNAME: localhost
      CODEBATTLE_DB_PORT: '5432'
      CODEBATTLE_DB_USERNAME: postgres
      CODEBATTLE_DB_PASSWORD: postgres
      CODEBATTLE_DB_NAME: codebattle_test
      CODEBATTLE_DB_SSL: 'false'
      OTP_VERSION: '29.0.3'
      ELIXIR_VERSION: '1.20.4'

    services:
      db:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name=pg_ci
          --mount type=tmpfs,destination=/var/lib/postgresql/data

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: ./deps
          key: ${{ runner.os }}-deps-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ./_build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'mix.exs', 'config/**/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Get deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        working-directory: .

      - name: Mix deps.compile
        run: mix compile --warnings-as-errors
        working-directory: .

      - name: Setup db
        run: mix ecto.create && mix ecto.migrate
        working-directory: .

      - name: Mix tests
        # setup-beam and the service database belong to this runner.
        run: make DEV=env test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./cover/excoveralls.json
          fail_ci_if_error: false

  elixir_quality:
    if: github.repository == 'hexlet-codebattle/codebattle'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MIX_ENV: test
      OTP_VERSION: '29.0.3'
      ELIXIR_VERSION: '1.20.4'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: ./deps
          key: ${{ runner.os }}-deps-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: ./_build
          key: ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'mix.exs', 'config/**/*.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.MIX_ENV }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Ensure Dialyzer PLT directory
        run: mkdir -p priv/plts

      - name: Cache Dialyzer PLT
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-dialyzer-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-dialyzer-plt-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Get deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
        working-directory: .

      - name: Mix deps.compile
        run: mix compile --warnings-as-errors
        working-directory: .

      - name: Mix format
        run: mix format --check-formatted
        working-directory: .

      - name: Mix credo
        run: mix credo --strict
        working-directory: .

      # - name: Hex audit
      #   run: mix hex.audit
      #   working-directory: .

      # - name: Deps audit
      #   run: mix deps.audit
      #   working-directory: .

      - name: Mix dialyzer
        run: make DEV=env dialyzer

  frontend_quality:
    if: github.repository == 'hexlet-codebattle/codebattle'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: ./frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      # TODO: uncomment when pnpm fixes audit for new npm bulk advisory endpoint
      # https://github.com/pnpm/pnpm/issues/11265
      # - name: Frontend deps audit
      #   run: pnpm audit --audit-level high
      #   working-directory: ./frontend

      - name: Frontend lint
        run: pnpm run lint
        working-directory: ./frontend

      - name: Frontend typecheck
        run: pnpm run typecheck
        working-directory: ./frontend

      - name: Frontend build
        run: pnpm run build
        working-directory: ./frontend

  build_images:
    needs: [changes, backend_tests, elixir_quality, frontend_quality]
    if: |
      github.repository == 'hexlet-codebattle/codebattle' &&
      needs.changes.outputs.codebattle_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: vtm9
          password: ${{ secrets.GH_REGISTRY_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build codebattle image layers
        if: needs.changes.outputs.codebattle_image == 'true'
        run: |
          make BUILDX_OUTPUT=--load GIT_HASH=${{ github.sha }} build-codebattle

      - name: Login to Github Container Registry (before push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: vtm9
          password: ${{ secrets.GH_REGISTRY_TOKEN }}

      - name: Push codebattle image set
        if: needs.changes.outputs.codebattle_image == 'true'
        run: |
          make push-codebattle
